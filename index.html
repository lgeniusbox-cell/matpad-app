<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTV Arena - Shell TV de référence (navigation + rangées)</title>
<style>
/* ===== CONFIG LAYOUT : tout est exprimé en unités de 1 px à 1920 px de large ===== */
:root{
  --u: calc(100vw / 1920);
  --rail: calc(var(--u) * 104);
  --rail-open: calc(var(--u) * 340);
  --gutter: calc(var(--u) * 56);
  --gap: calc(var(--u) * 24);
  --pad: calc(var(--u) * 24);   /* marge anti-rognage : le zoom du focus n'est jamais coupé */
  --cols: 4;                     /* nombre de cartes ENTIÈREMENT visibles par rangée */
  --card-w: calc((100vw - var(--rail) - 2 * var(--gutter) - (var(--cols) - 1) * var(--gap)) / var(--cols));
  --card-h: calc(var(--card-w) * 9 / 16);
  --bg:#0b0c12; --fg:#f4f5f8; --dim:#9aa0b4; --accent:#ff3d6e;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif;overflow:hidden}
#app{position:absolute;inset:0}

/* ---- Rail de navigation (superposé, ne décale jamais le contenu) ---- */
#rail{position:absolute;z-index:20;top:0;bottom:0;left:0;width:var(--rail);padding:0 calc(var(--u)*16);
  display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*12);
  background:linear-gradient(90deg,var(--bg) 72%,rgba(11,12,18,0));transition:width .18s ease}
#rail.open{width:var(--rail-open)}
.rail-item{display:flex;align-items:center;gap:calc(var(--u)*22);height:calc(var(--u)*76);padding:0 calc(var(--u)*20);
  border-radius:calc(var(--u)*38);color:var(--dim);white-space:nowrap;overflow:hidden}
.rail-item svg{width:calc(var(--u)*40);height:calc(var(--u)*40);flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail-item span{font-size:calc(var(--u)*30);opacity:0;transition:opacity .12s}
#rail.open .rail-item span{opacity:1}
.rail-item.active{color:var(--fg);box-shadow:inset calc(var(--u)*5) 0 0 var(--accent)}
.rail-item.is-focused{background:#fff;color:#111;box-shadow:none}

/* ---- Écrans ---- */
#screens{position:absolute;inset:0 0 0 var(--rail)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.head{padding:calc(var(--u)*44) var(--gutter) calc(var(--u)*8);height:calc(var(--u)*150)}
.head h1{font-size:calc(var(--u)*56);font-weight:700;letter-spacing:-.5px}
.head p{font-size:calc(var(--u)*28);color:var(--dim);margin-top:calc(var(--u)*6)}
.wrap{flex:1;position:relative;overflow:hidden}
.shelves{position:relative;transition:transform .25s ease;will-change:transform}
.screen[data-screen=home]{--cols:3}

/* ---- Une rangée = un genre = UNE seule ligne horizontale ---- */
.shelf{margin-bottom:calc(var(--u)*12)}
.shelf-title{height:calc(var(--u)*60);display:flex;align-items:flex-end;gap:calc(var(--u)*14);padding:0 var(--gutter);
  font-size:calc(var(--u)*34);font-weight:600}
.shelf-title small{font-size:calc(var(--u)*24);color:var(--dim);font-weight:400}
.viewport{margin:0 calc(var(--gutter) - var(--pad));padding:var(--pad);overflow:hidden}
.track{position:relative;display:flex;flex-wrap:nowrap;gap:var(--gap);transition:transform .22s ease;will-change:transform}

/* ---- Carte à taille FIXE (toutes identiques) ---- */
.card{position:relative;flex:0 0 var(--card-w);width:var(--card-w);height:var(--card-h);border-radius:calc(var(--u)*14);
  overflow:hidden;background:#1b1d2a;transition:transform .15s ease,box-shadow .15s ease}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85))}
.card .meta{position:absolute;left:calc(var(--u)*18);right:calc(var(--u)*18);bottom:calc(var(--u)*14)}
.card .meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:calc(var(--u)*30);line-height:1.15}
.card .meta small{display:block;margin-top:calc(var(--u)*4);font-size:calc(var(--u)*22);color:#cfd3e2}
.card .tag{position:absolute;top:calc(var(--u)*14);left:calc(var(--u)*14);padding:calc(var(--u)*4) calc(var(--u)*12);border-radius:calc(var(--u)*20);
  font-size:calc(var(--u)*20);font-weight:700;background:rgba(0,0,0,.65);text-transform:uppercase}
.card .dur{position:absolute;top:calc(var(--u)*14);right:calc(var(--u)*14);padding:calc(var(--u)*4) calc(var(--u)*10);border-radius:calc(var(--u)*8);
  font-size:calc(var(--u)*20);background:rgba(0,0,0,.65)}
.card.locked{filter:grayscale(1) brightness(.7)}
.card.tile .meta b{font-size:calc(var(--u)*40)}
.is-focused{transform:scale(1.06);z-index:3}
.card.is-focused{box-shadow:0 0 0 calc(var(--u)*5) #fff,0 calc(var(--u)*16) calc(var(--u)*40) rgba(0,0,0,.7)}
.bump{animation:bump .18s}
@keyframes bump{30%{transform:translateX(calc(var(--u)*-8)) scale(1.06)}70%{transform:translateX(calc(var(--u)*8)) scale(1.06)}}

/* ---- Dialogue, toast, indicateurs ---- */
#dialog{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center}
.dlg{background:#171925;border-radius:calc(var(--u)*20);padding:calc(var(--u)*48);min-width:calc(var(--u)*760);text-align:center}
.dlg h2{font-size:calc(var(--u)*44);margin-bottom:calc(var(--u)*32)}
.dlg-btns{display:flex;gap:calc(var(--u)*24);justify-content:center}
.btn{padding:calc(var(--u)*18) calc(var(--u)*52);border-radius:calc(var(--u)*14);font-size:calc(var(--u)*30);background:#2a2d40}
.btn.is-focused{background:#fff;color:#111;box-shadow:0 0 0 calc(var(--u)*5) var(--accent)}
#toast{position:absolute;z-index:60;left:50%;bottom:calc(var(--u)*60);transform:translateX(-50%);padding:calc(var(--u)*16) calc(var(--u)*36);
  border-radius:calc(var(--u)*40);background:#fff;color:#111;font-size:calc(var(--u)*30);font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#feet{position:absolute;z-index:40;right:calc(var(--u)*40);bottom:calc(var(--u)*30);display:flex;gap:calc(var(--u)*10)}
#feet b{width:calc(var(--u)*56);height:calc(var(--u)*56);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#23263a;color:var(--dim);font-size:calc(var(--u)*26)}
#feet b.on{background:var(--accent);color:#fff}
#dbg{position:absolute;z-index:99;top:8px;right:8px;max-width:46vw;padding:8px 10px;background:rgba(0,0,0,.85);color:#7CFC98;
  font:12px/1.4 monospace;white-space:pre-wrap;border-radius:6px}
</style>
</head>
<body>
<div id="app">
  <nav id="rail" data-zone data-dir="v" aria-label="Navigation">
    <a class="rail-item" data-focusable data-action="go:home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></a>
    <a class="rail-item" data-focusable data-action="go:games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 14h.01"/></svg><span>Jeux</span></a>
    <a class="rail-item" data-focusable data-action="go:runs"><svg viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2 2-6-3-2-3 2-2 4M16 11l3 2"/></svg><span>Virtual Run</span></a>
    <a class="rail-item" data-focusable data-action="locked"><svg viewBox="0 0 24 24"><path d="M20 8.5c0 5-8 11-8 11S4 13.5 4 8.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 8 2.5z"/></svg><span>Cardio (bientôt)</span></a>
  </nav>
  <main id="screens">
    <section class="screen" data-screen="home"><header class="head"><h1>FitTV Arena</h1><p>Choisissez votre activité</p></header><div class="wrap"><div class="shelves" id="sh-home"></div></div></section>
    <section class="screen" data-screen="games" hidden><header class="head"><h1>Jeux</h1><p>Une rangée par genre</p></header><div class="wrap"><div class="shelves" id="sh-games"></div></div></section>
    <section class="screen" data-screen="runs" hidden><header class="head"><h1>Virtual Run</h1><p>Une rangée par genre</p></header><div class="wrap"><div class="shelves" id="sh-runs"></div></div></section>
  </main>
</div>
<div id="dialog" hidden role="dialog" aria-modal="true"><div class="dlg"><h2>Quitter FitTV Arena ?</h2>
  <div class="dlg-btns" data-zone data-dir="h"><a class="btn" data-focusable data-action="exit">Quitter</a><a class="btn" data-focusable data-action="stay">Rester</a></div></div></div>
<div id="toast"></div>
<div id="feet"><b id="fl">L</b><b id="fr">R</b></div>
<pre id="dbg" hidden></pre>

<script>
(() => {
'use strict';
/* =====================================================================
   CONFIG
   ===================================================================== */
const CFG = { repeatMs: 90, mute: /[?&]mute/.test(location.search), debug: /[?&]debug/.test(location.search) };
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  n.append(...kids); return n;
};

/* =====================================================================
   SON : le "tick" ne joue QUE si le focus a vraiment bougé
   ===================================================================== */
let ac = null;
function beep(freq, dur, vol) {
  if (CFG.mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const Snd = { tick: () => beep(660, .05, .06), ok: () => beep(880, .09, .08), bump: () => beep(140, .08, .05) };

/* =====================================================================
   MOTEUR DE NAVIGATION (par structure, pas par géométrie)
   - [data-zone][data-dir=h|v] = une rangée (h) ou une liste verticale (v)
   - [data-focusable] = élément focalisable dans une zone
   - Zones empilées dans l'ordre du DOM ; #rail est la zone de gauche
   - Focus VIRTUEL (classe .is-focused) : jamais element.focus(), donc le
     navigateur ne fait aucun défilement parasite
   ===================================================================== */
const S = { cur: null, last: new WeakMap(), col: 0, lastContent: null, screen: 'home', prev: null };
const isVis = e => !e.closest('[hidden],[inert]');
const root  = () => $('#dialog:not([hidden])') || $('#app');
const zones = () => $$('[data-zone]', root()).filter(isVis)
  .map(z => ({ el: z, dir: z.dataset.dir || 'h', items: $$('[data-focusable]', z).filter(isVis) }))
  .filter(z => z.items.length);

function reveal(z, item) {
  const track = z.el.querySelector('.track');
  if (track) {                                    // défilement horizontal minimal, aligné sur les cartes
    const vp = track.parentElement, P = parseFloat(getComputedStyle(vp).paddingLeft) || 0, W = vp.clientWidth - 2 * P;
    let off = z.el._off || 0; const L = item.offsetLeft, R = L + item.offsetWidth;
    if (R - off > W + 1) off = R - W;
    if (L - off < 0) off = L;
    z.el._off = off; track.style.transform = `translateX(${-off}px)`;
  }
  const shelves = z.el.closest('.shelves');       // défilement vertical : la rangée active se cale en haut
  if (shelves) shelves.style.transform = `translateY(${-z.el.offsetTop}px)`;
}

function setFocus(z, i, silent) {
  const item = z.items[Math.max(0, Math.min(i, z.items.length - 1))];
  if (S.cur && S.cur.item !== item) S.cur.item.classList.remove('is-focused');
  item.classList.add('is-focused');
  S.cur = { zone: z.el, item }; S.last.set(z.el, item);
  $('#rail').classList.toggle('open', z.el.id === 'rail');
  reveal(z, item);
  if (!silent) Snd.tick();
  return true;
}

function move(dir) {
  const zs = zones(); if (!zs.length) return false;
  const content = zs.filter(z => z.el.id !== 'rail'), rail = zs.find(z => z.el.id === 'rail');
  const zi = S.cur ? zs.findIndex(z => z.el === S.cur.zone) : -1;
  if (zi < 0 || !zs[zi].items.includes(S.cur.item)) return setFocus(content[0] || zs[0], 0);   // récupération
  const z = zs[zi], i = z.items.indexOf(S.cur.item), n = z.items.length, inRail = z.el.id === 'rail';
  const rem = t => Math.max(0, t.items.indexOf(S.last.get(t.el)));
  const vertical = dir === 'up' || dir === 'down', step = (dir === 'up' || dir === 'left') ? -1 : 1;

  if (z.dir === 'v') {                                           // rail / liste verticale
    if (vertical) { const j = i + step; return j >= 0 && j < n ? setFocus(z, j) : false; }
    if (dir === 'right' && inRail) {
      const t = content.find(c => c.el === S.lastContent) || content[0];
      if (!t) return false; S.col = rem(t); return setFocus(t, S.col);
    }
    return false;
  }
  if (!vertical) {                                               // rangée : gauche / droite
    const j = i + step;
    if (j >= 0 && j < n) { S.col = j; return setFocus(z, j); }
    if (dir === 'left' && rail && !inRail) { S.lastContent = z.el; return setFocus(rail, rem(rail)); }
    return false;
  }
  const t = content[content.indexOf(z) + step];                  // rangée suivante / précédente
  if (!t) return false;
  S.col = i; return setFocus(t, Math.min(S.col, t.items.length - 1));
}

/* ---- Actions déclenchées par OK ---- */
const ACTIONS = {
  go: arg => show(arg),
  open: (arg) => toast('Lancement : ' + arg),
  locked: () => toast('Bientôt disponible'),
  stay: () => closeDlg(),
  exit: () => { toast('Fermeture…'); if (window.Android && window.Android.exitApp) window.Android.exitApp(); }
};
function activate() {
  const it = S.cur && S.cur.item; if (!it || !it.isConnected) return false;
  Snd.ok();
  const [name, arg] = (it.dataset.action || '').split(/:(.*)/s);
  if (ACTIONS[name]) ACTIONS[name](arg, it); else it.click();
  return true;
}

function show(name) {
  $$('.screen').forEach(s => { s.hidden = s.dataset.screen !== name; });
  $$('.rail-item').forEach(r => r.classList.toggle('active', r.dataset.action === 'go:' + name));
  S.screen = name; S.col = 0; S.lastContent = null;
  const z = zones().find(x => x.el.id !== 'rail');
  if (z) { S.lastContent = z.el; setFocus(z, 0, true); }
}
function openDlg() { S.prev = S.cur; $('#dialog').hidden = false; setFocus(zones()[0], 1, true); }
function closeDlg() {
  $('#dialog').hidden = true;
  const p = S.prev, z = p && zones().find(x => x.el === p.zone);
  if (z && z.items.includes(p.item)) setFocus(z, z.items.indexOf(p.item), true);
}
function back() {
  if (!$('#dialog').hidden) return closeDlg();
  if (S.cur && S.cur.zone.id !== 'rail') {                       // contenu -> rail
    const rz = zones().find(z => z.el.id === 'rail'); S.lastContent = S.cur.zone;
    return setFocus(rz, Math.max(0, rz.items.findIndex(i => i.classList.contains('active'))));
  }
  if (S.screen !== 'home') return show('home');                  // rail -> accueil
  openDlg();                                                     // accueil -> "Quitter ?"
}

/* =====================================================================
   ENTRÉES : UNE seule porte d'entrée pour clavier, télécommande, manette
   ===================================================================== */
const KEY = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', Enter:'ok', ' ':'ok',
  Escape:'back', Backspace:'back', GoBack:'back', BrowserBack:'back' };
const KC = { 19:'up', 20:'down', 21:'left', 22:'right', 23:'ok', 66:'ok', 4:'back', 111:'back' };   // codes DPAD Android
let lastNav = 0;
const logs = [];
function dbg(msg) {
  logs.push(msg); if (logs.length > 8) logs.shift();
  const d = $('#dbg'); if (!d.hidden) d.textContent = logs.join('\n');
}
function dispatch(a, src) {
  if (a === 'up' || a === 'down' || a === 'left' || a === 'right') {
    const now = performance.now(); if (now - lastNav < CFG.repeatMs) return; lastNav = now;
    const moved = move(a);
    if (!moved) { Snd.bump(); if (S.cur) { const n = S.cur.item; n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); } }
    dbg(`${src}: ${a} -> ${moved ? 'déplacé' : 'bloqué (bord)'}`);
  } else if (a === 'ok') { dbg(`${src}: ok`); activate(); }
  else if (a === 'back') { dbg(`${src}: retour`); back(); }
}
function step(side) {
  const n = $(side === 'L' ? '#fl' : '#fr'); n.classList.add('on'); setTimeout(() => n.classList.remove('on'), 160);
  dbg('pas ' + side);
}
addEventListener('keydown', e => {
  if ((e.code === 'KeyL' || e.code === 'KeyR') && !e.ctrlKey && !e.metaKey) {      // pas de la tapis : Alt+L / Alt+R (ou L / R)
    e.preventDefault(); if (!e.repeat) step(e.code === 'KeyL' ? 'L' : 'R'); return;
  }
  if (e.code === 'Backquote') { const d = $('#dbg'); d.hidden = !d.hidden; d.textContent = logs.join('\n'); return; }
  const a = KEY[e.key] || KC[e.keyCode];
  if (!a) { dbg(`NON MAPPÉE key=${e.key} code=${e.code} keyCode=${e.keyCode}`); return; }
  e.preventDefault(); e.stopPropagation();
  if (e.repeat && (a === 'ok' || a === 'back')) return;
  dispatch(a, 'clavier');
}, true);

const GP = { held: {}, next: {} };
function pollPad(t) {
  const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
  const p = pads[0];
  if (p) {
    const b = i => p.buttons[i] && p.buttons[i].pressed;
    const st = { up: b(12) || p.axes[1] < -.6, down: b(13) || p.axes[1] > .6, left: b(14) || p.axes[0] < -.6,
      right: b(15) || p.axes[0] > .6, ok: b(0), back: b(1), stepL: b(4), stepR: b(5) };
    for (const k in st) {
      if (st[k]) {
        if (!GP.held[k]) { GP.held[k] = true; GP.next[k] = t + 400; if (k === 'stepL') step('L'); else if (k === 'stepR') step('R'); else dispatch(k, 'manette'); }
        else if ('updownleftright'.includes(k) && t >= GP.next[k]) { GP.next[k] = t + 120; dispatch(k, 'manette'); }
      } else GP.held[k] = false;
    }
  }
  requestAnimationFrame(pollPad);
}

/* =====================================================================
   DONNÉES DE DÉMO + RENDU (le vrai app lit ./games et ./virtual-run)
   ===================================================================== */
const mk = (title, genre, diff, level, dur, best) => ({ title, genre, diff, level, dur, best });
const DATA = {
  games: [mk('Dojo Initiation', 'Combat', 'easy', 1, '01:10', '1 250'), mk('Ninja Rush', 'Combat', 'normal', 2, '02:40', '—'),
    mk('Arène du Dragon', 'Combat', 'hard', 3, '03:05', '—'), mk('Saut de la Forêt', 'Enfants', 'easy', 1, '01:30', '900'),
    mk('Pirates Express', 'Enfants', 'easy', 1, '02:00', '—'), mk('Super Ballon', 'Enfants', 'normal', 2, '02:20', '—'),
    mk('Cardio Flash', 'Cardio', 'normal', 2, '05:00', '—'), mk('Tabata Jump', 'Cardio', 'hard', 3, '04:00', '—'),
    mk('Échauffement', 'Cardio', 'easy', 1, '03:00', '—'), mk('Défi Express', 'Cardio', 'hard', 3, '02:30', '—'),
    mk('Marathon Jump', 'Cardio', 'hard', 3, '08:00', '—'), mk('Sans genre', '', 'normal', 2, '01:00', '—')],
  runs: [mk('Sentier Alpin & Forêt', 'Nature', 'normal', 2, '34:40', '5,2 km'), mk('Cascade Cachée', 'Nature', 'easy', 1, '20:00', '—'),
    mk('Forêt de Brume', 'Nature', 'normal', 2, '28:00', '—'), mk('Rivière Claire', 'Nature', 'easy', 1, '15:00', '—'),
    mk('Prairie Dorée', 'Nature', 'easy', 1, '18:00', '—'), mk('Plage de Corail', 'Plage', 'easy', 1, '25:00', '—'),
    mk('Dunes au Coucher', 'Plage', 'normal', 2, '30:00', '—'), mk('Col des Aigles', 'Montagne', 'hard', 3, '45:00', '—'),
    mk('Crête Enneigée', 'Montagne', 'hard', 3, '40:00', '—'), mk('Vallée Verte', 'Montagne', 'normal', 2, '32:00', '—')]
};
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

function card(it) {
  const h = hue(it.title), c = el('a', { class: 'card', 'data-focusable': true, 'data-action': 'open:' + it.title });
  c.style.background = `linear-gradient(135deg,hsl(${h} 55% 30%),hsl(${(h + 60) % 360} 55% 14%))`;
  const img = el('img', { src: 'https://i.ytimg.com/vi/XTgSxQ6ZLM0/hqdefault.jpg', alt: '', loading: 'lazy' });
  img.onerror = () => img.remove();
  c.append(img, el('div', { class: 'shade' }), el('span', { class: 'tag', text: it.diff + ' · niv. ' + it.level }),
    el('span', { class: 'dur', text: it.dur }),
    el('div', { class: 'meta' }, el('b', { text: it.title }), el('small', { text: 'Meilleur : ' + it.best })));
  return c;
}
function shelf(title, cards) {
  return el('section', { class: 'shelf', 'data-zone': true, 'data-dir': 'h' },
    el('h2', { class: 'shelf-title' }, title, el('small', { text: String(cards.length) })),
    el('div', { class: 'viewport' }, el('div', { class: 'track' }, ...cards)));
}
function shelves(box, items) {                       // un genre = une rangée
  const g = new Map();
  items.forEach(i => { const k = (i.genre || '').trim() || 'Autres'; (g.get(k) || g.set(k, []).get(k)).push(i); });
  [...g.keys()].sort((a, b) => a === 'Autres' ? 1 : b === 'Autres' ? -1 : a.localeCompare(b, 'fr')).forEach(k => {
    const list = g.get(k).sort((a, b) => a.level - b.level || a.title.localeCompare(b.title, 'fr'));
    box.append(shelf(k, list.map(card)));
  });
}
function tile(title, sub, hueV, action, locked) {
  const c = el('a', { class: 'card tile' + (locked ? ' locked' : ''), 'data-focusable': true, 'data-action': action });
  c.style.background = `linear-gradient(135deg,hsl(${hueV} 60% 34%),hsl(${(hueV + 60) % 360} 60% 14%))`;
  c.append(el('div', { class: 'shade' }), el('div', { class: 'meta' }, el('b', { text: title }), el('small', { text: sub })));
  return c;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('on'), 1800); }

function init() {
  $('#sh-home').append(shelf('Activités', [tile('Jeux', 'Obstacles, rythme et score', 330, 'go:games'),
    tile('Virtual Run', 'Courez dans la vidéo', 150, 'go:runs'), tile('Séances cardio', 'Bientôt disponible', 210, 'locked', true)]));
  shelves($('#sh-games'), DATA.games); shelves($('#sh-runs'), DATA.runs);
  if (CFG.debug) { $('#dbg').hidden = false; }
  show('home'); requestAnimationFrame(pollPad);
  window.TVNav = { move, activate, back, show, dispatch, state: S };      // pont pour Java / tests
}
init();
})();
